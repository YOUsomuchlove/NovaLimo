# Full stack: DB + API + web booking + web admin (build trong Docker).
#
# Lệnh:
#   docker compose -f docker-compose.yml -f docker-compose.stack.yml up --build
# Nền:
#   docker compose -f docker-compose.yml -f docker-compose.stack.yml up -d --build
#
# Nếu `npm install` trong build bị ECONNRESET, build lần lượt:
#   npm run docker:stack:build:sequential && npm run docker:stack:up
#
# Sau khi lên:
#   - API:     http://localhost:3000/api
#   - Booking: http://localhost:3001
#   - Admin:   http://localhost:3002
#
# Biến môi trường (khuyến nghị): copy .env.example → .env ở root repo.
# Docker Compose tự đọc .env để thay ${JWT_SECRET}, ${NEXT_PUBLIC_API_URL}, …
# Lưu ý: DATABASE_URL trong .env hay là localhost — API trong container phải dùng host
# `postgres` (đã cố định bên dưới), không lấy từ .env để tránh lỗi kết nối DB.
#
# NEXT_PUBLIC_API_URL — URL mà trình duyệt gọi được tới API (mặc định localhost:3000).
# Build Next embed giá trị này; đổi domain thì set trong .env rồi build lại image.
#
# OSRM cùng stack (profile osrm trong docker-compose.yml):
#   docker compose -f docker-compose.yml -f docker-compose.stack.yml --profile osrm up -d --build
# Trong .env đặt: OSRM_BASE_URL=http://osrm:5000
# (Không bật profile osrm thì để trống hoặc không set OSRM_BASE_URL.)

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: novalimo-api:local
    container_name: novalimo-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_MIGRATE_ON_BOOT: 'true'
      TYPEORM_LOGGING: 'false'
      # Mạng Docker: host là service `postgres`, không dùng localhost.
      DATABASE_URL: postgresql://novalimo:novalimo@postgres:5432/novalimo
      JWT_SECRET: novalimo-docker-jwt-secret-key-2026-min-32-chars
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret-0123456789
      SMS_PROVIDER: esms
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://127.0.0.1:3001,http://127.0.0.1:3002,http://localhost:8081,http://127.0.0.1:8081
      UPLOADS_DIR: /app/uploads
    volumes:
      - novalimo_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  web-booking:
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        NX_APP: web-booking
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    image: novalimo-web-booking:local
    container_name: novalimo-web-booking
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - '3001:3000'
    depends_on:
      api:
        condition: service_healthy

  web-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        NX_APP: web-admin
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    image: novalimo-web-admin:local
    container_name: novalimo-web-admin
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - '3002:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  novalimo_uploads:
