# Chạy full stack: DB + API + web booking + web admin (build trong Docker).
# Lệnh: docker compose -f docker-compose.yml -f docker-compose.stack.yml up --build
#
# Nếu `npm install` trong build bị ECONNRESET (mạng không ổn), thử build lần lượt:
#   docker compose -f docker-compose.yml -f docker-compose.stack.yml build api
#   docker compose -f docker-compose.yml -f docker-compose.stack.yml build web-booking web-admin
#   docker compose -f docker-compose.yml -f docker-compose.stack.yml up -d
# Hoặc: npm run docker:stack:build:sequential && npm run docker:stack:up
#
# Sau khi lên:
#   - API:     http://localhost:3000/api
#   - Booking: http://localhost:3001
#   - Admin:   http://localhost:3002
#
# NEXT_PUBLIC_API_URL phải là URL mà **trình duyệt** truy cập được tới API
# (mặc định localhost:3000). Khi deploy domain khác, build lại với build-arg / env file.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: novalimo-api:local
    container_name: novalimo-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      # Bắt buộc để TypeORM tạo bảng: production tắt synchronize mặc định, repo chưa có migration full schema.
      TYPEORM_SYNCHRONIZE: 'true'
      DATABASE_URL: postgresql://novalimo:novalimo@postgres:5432/novalimo
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  web-booking:
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        NX_APP: web-booking
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    image: novalimo-web-booking:local
    container_name: novalimo-web-booking
    restart: unless-stopped
    ports:
      - '3001:3000'
    depends_on:
      - api

  web-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        NX_APP: web-admin
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    image: novalimo-web-admin:local
    container_name: novalimo-web-admin
    restart: unless-stopped
    ports:
      - '3002:3000'
    depends_on:
      - api
