name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - uses: nrwl/nx-set-shas@v4
      - name: Lint · Typecheck · Test · Build (affected)
        run: npx nx affected -t lint typecheck test build --parallel=3
